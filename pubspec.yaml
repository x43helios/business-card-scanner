name: business_card_scanner
description: Business Card Scanner / 名片掃描 — local-first OCR MVP for iOS & Android.
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  uuid: ^4.5.1
  pdf: ^3.11.1
  share_plus: ^10.1.3
  intl: any
  collection: ^1.19.0
  google_mlkit_text_recognition: ^0.14.0
  permission_handler: ^11.3.1
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansTC-Regular.ttf

# Temporary override for Android MVP run: image 4.11 + archive 4.0.9 break (missing decodeLazy).
dependency_overrides:
  archive: 4.5.2
  image: 4.12.0
